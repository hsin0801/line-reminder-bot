name: 提醒-完成行程

on:
  schedule:
    - cron: '15 9 * * 1,2,4,6'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          REMINDER_KEY: evening_schedule
        run: python send_reminder.py
