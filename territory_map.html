<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>巧克力轄區銷售圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: map canvas left with month bar; salesperson roster + detail right; stacks on phones */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --fg:#1d2321; --muted:#66706c; --line:#d9ddd9; --sea:#e6ecef; --none:#dfe3e0; --stroke:#ffffff; --accent:#c4161c; --off:#eceeec;
  --a0:#e6f2ea; --a1:#b9dcc5; --a2:#7cbf97; --a3:#3f9a68; --a4:#1d6b43;
  --h0:#f3e9e3; --h1:#e2c6b3; --h2:#c99878; --h3:#a8694a; --h4:#7b4a2e;
  --good:#2e7d4f; --bad:#c4161c;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151918; --panel:#1d2221; --fg:#e7ebe9; --muted:#97a19d; --line:#323a37; --sea:#111517; --none:#2c3230; --stroke:#151918; --accent:#ff5a5f; --off:#252b29;
  --a0:#1c2d24; --a1:#24533a; --a2:#2f7d53; --a3:#55b07d; --a4:#9be0b6;
  --h0:#2e241f; --h1:#4d3427; --h2:#7a4f36; --h3:#a8714f; --h4:#d9a07c; --good:#5cc489; --bad:#ff5a5f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151918; --panel:#1d2221; --fg:#e7ebe9; --muted:#97a19d; --line:#323a37; --sea:#111517; --none:#2c3230; --stroke:#151918; --accent:#ff5a5f; --off:#252b29;
  --a0:#1c2d24; --a1:#24533a; --a2:#2f7d53; --a3:#55b07d; --a4:#9be0b6;
  --h0:#2e241f; --h1:#4d3427; --h2:#7a4f36; --h3:#a8714f; --h4:#d9a07c; --good:#5cc489; --bad:#ff5a5f; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%;min-height:600px}
.mapwrap{position:relative;background:var(--sea);overflow:hidden;min-width:0}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.town{stroke:var(--stroke);stroke-width:.5;vector-effect:non-scaling-stroke;transition:fill .2s}
.town:hover{stroke:var(--fg);stroke-width:1.5}
.town.sel{stroke:var(--fg);stroke-width:2.2}
.county{fill:none;stroke:var(--fg);stroke-opacity:.5;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.homeline{fill:none;stroke:var(--h4);stroke-width:2.2;vector-effect:non-scaling-stroke;pointer-events:none}
.tlabel{font-size:9px;fill:var(--fg);paint-order:stroke;stroke:var(--panel);stroke-width:2.5px;pointer-events:none;text-anchor:middle}
.top{position:absolute;left:16px;top:12px;right:16px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.top h1{margin:0;font-size:19px;font-weight:900;pointer-events:none}
.top .who{font-size:13px;color:var(--muted);pointer-events:none}
.seg{display:flex;gap:4px;flex-wrap:wrap;align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);padding:4px 9px;border-radius:7px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--fg);color:var(--panel);font-weight:700}
button:focus-visible,li:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:17px;cursor:pointer}
.mlegend{position:absolute;left:16px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:5px;max-width:calc(100% - 90px)}
.bins{display:flex;flex-wrap:wrap;gap:6px 10px}.bins span{display:flex;align-items:center;gap:4px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.15);min-width:180px;max-width:270px;z-index:5}
.dn{color:var(--muted);font-size:11px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:6px;font-size:12px}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.big{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.pct{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;text-align:right}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-width:0}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.sec h2{margin:0;font-size:16px}.sec h4{margin:0;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px}
table.rt{border-collapse:collapse;width:100%;font-size:13px}
table.rt th{font-size:11px;color:var(--muted);font-weight:500;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
table.rt th:first-child{text-align:left}
table.rt td{padding:5px 4px;text-align:right;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line)}
table.rt td:first-child{text-align:left;font-family:var(--font);font-size:13px}
table.rt tr.r{cursor:pointer}
table.rt tr.r:hover td{color:var(--accent)}
table.rt tr.on td{background:var(--bg);font-weight:700}
table.rt tr.grp td{font-weight:700;background:var(--off);cursor:pointer}
.cellbar{display:inline-block;height:6px;border-radius:3px;background:var(--h3);vertical-align:middle;margin-right:4px}
ul.lst{list-style:none;padding:0;margin:0}
ul.lst li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:4px 2px;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer}
ul.lst li:hover{color:var(--accent)}
.tw{overflow-x:auto}
table.ht{border-collapse:collapse;font-size:12px;width:100%}
table.ht th,table.ht td{padding:3px 5px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.ht th:first-child,table.ht td:first-child{text-align:left}
table.ht thead th{color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
table.ht td{font-family:var(--mono);font-size:11px}
table.ht tr.tot td{border-top:1px solid var(--line);font-weight:700}
.foot{font-size:11px;color:var(--muted);line-height:1.6}
.warn{color:var(--bad)}
@media (max-width:880px){.app{grid-template-columns:1fr;grid-template-rows:72vh auto;height:auto}.panel{border-left:none;border-top:1px solid var(--line)}.mlegend{bottom:58px}}
@media (prefers-reduced-motion:reduce){.town{transition:none}}

.king{pointer-events:auto;cursor:pointer}
.king image{filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.king .kn{font-size:11px;font-weight:900;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-opacity:.55}
.king .kc{font-size:10px;font-weight:900;text-anchor:middle;fill:#fff}
.kbtn{position:absolute;right:16px;top:12px;z-index:5;font:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.kbtn.on{background:#c4161c;color:#fff;border-color:#c4161c}
.ktab{width:100%}.ktab td{padding:4px 6px;font-size:12px;border-bottom:1px solid var(--line)}.ktab td:first-child{white-space:nowrap}.ktab td:last-child{white-space:nowrap}.ktab td:last-child{text-align:right;font-family:var(--mono)}
.ktab img{width:22px;height:22px;vertical-align:middle;border-radius:50%}

    <div class="tile"><span class="dn">銷售台數</span><span class="big">${s.tot}</span><span class="dn">租賃 ${s.rent}・公司車 ${s.co}</span></div></div>
   <h4>📍 ${isRep()?'我':''}在各區賣了幾台（${s.allList.length} 區，點區名可放大）</h4><ul class="lst">${s.allList.slice(0,isRep()?99:15).map(x=>{const f=byCode.get(x.c);return `<li data-c="${x.c}" tabindex="0"><span>${f.properties.y.replace(/[縣市]$/,'')} ${f.properties.n} <span class="dn">${x.inH?'轄區內':'轄區外'}</span></span><span class="pct">${x.n} 台</span></li>`}).join('')||'<li><span class="dn">無</span></li>'}</ul>${!isRep()&&s.allList.length>15?`<span class="dn">只列前 15 區，點個人可看完整清單。</span>`:''}

function roster(){
  const groups=[['all:巧克力','巧克力合計',null],['store:歸仁','歸仁店',['歸仁一課','歸仁二課','歸仁其他']],['store:永康','永康店',['永康一課','永康二課','永康三課']]];
  const sortF={self:x=>x.s.self??-1,out:x=>x.s.out,tot:x=>x.s.tot}[sortBy];
  let rows='';
  groups.forEach(([key,label,teams])=>{
    const s=rowStat(key); rows+=`<tr class="grp${selKey===key?' on':''}" data-k="${key}"><td>${label}</td><td>${s.tot}</td><td>${pc(s.self,0)}</td><td>${s.out}</td></tr>`;
    (teams||[]).forEach(t=>{
      const rs=REPS.filter(r=>r.team===t); if(!rs.length)return;
      if(t==='歸仁其他')return;
      if(t!=='歸仁其他'){const ts=rowStat('team:'+t);rows+=`<tr class="r${selKey==='team:'+t?' on':''}" data-k="team:${t}"><td>　${t}</td><td>${ts.tot}</td><td>${pc(ts.self,0)}</td><td>${ts.out}</td></tr>`;}
      rs.filter(r=>!r.hide).map(r=>({r,s:rowStat('rep:'+r.n)})).filter(x=>x.s.tot>0).sort((a,b)=>sortF(b)-sortF(a)).forEach(({r,s})=>{
        rows+=`<tr class="r${selKey==='rep:'+r.n?' on':''}" data-k="rep:${r.n}"><td>　　${r.n}</td><td>${s.tot}</td><td><span class="cellbar" style="width:${Math.round((s.self||0)*40)}px"></span>${pc(s.self,0)}</td><td>${s.out}</td></tr>`;});
    });
  });
  return `<div class="sec"><h4>👤 人員（點表頭排序）</h4><span class="dn" style="display:block;margin:-2px 0 6px;color:#c4161c;font-weight:700">👉 點自己的名字，地圖會只顯示你的成績，下方會列出你在每個地區賣了幾台。點「巧克力合計」或據點回到轄區王。</span><div class="tw"><table class="rt"><thead><tr><th>人員</th><th data-s="tot">銷售</th><th data-s="self">自售率</th><th data-s="out">轄區外</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function render(){
  document.getElementById('who').textContent=`${unitName()}　·　${mLabel()}`;
  let h=`<div class="sec"><div class="seg"><button data-sc="store" class="${scope==='store'?'on':''}">轄區＝所屬據點 PMA</button><button data-sc="choc" class="${scope==='choc'?'on':''}">轄區＝巧克力 20 區</button></div>
   <span class="dn">自售率＝賣在轄區內的台數 ÷ 銷售台數（扣租賃、公司車）。轄區外＝賣在轄區以外的台數（含轄區無法定位的車）。依 W63 領牌日期與轄區欄計算。</span></div>`;
  if(selTown)h+=`<div class="sec">${townInfo(selTown)}<button class="seg" style="align-self:flex-start;font:inherit;font-size:12px;padding:3px 8px;cursor:pointer" id="ct">清除選取</button></div>`;
  h=roster()+h+detail()+`<div class="sec foot">資料來源：W63 銷售明細（歸仁、永康，2026/1/1–10/31）；區內 Honda 掛牌取自區域掛牌統計（2026.11.04）；轄區取自 2026年PMA佔有率表。課別依現行編制；已離職人員不列入個人名單，但銷售仍計入所屬課與據點合計。</div>`;
  panel.innerHTML=h;
  panel.querySelectorAll('[data-k]').forEach(tr=>tr.onclick=()=>{selKey=tr.dataset.k;recolor();render();});
  panel.querySelectorAll('[data-s]').forEach(th=>th.onclick=()=>{sortBy=th.dataset.s;render();});
  panel.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{scope=b.dataset.sc;recolor();render();});
  panel.querySelectorAll('li[data-c]').forEach(li=>li.onclick=()=>{selTown=li.dataset.c;recolor();render();zoomTo([byCode.get(selTown)],8);});
  const ct=panel.querySelector('#ct');if(ct)ct.onclick=()=>{selTown=null;recolor();render();};
  legend();
}
function legend(){const B=OB;document.getElementById('legend').innerHTML=`<span>轄區外：台數</span><div class="bins">${B.map(b=>`<span><span class="sw" style="background:var(${b[2]})"></span>${b[3]}</span>`).join('')}</div><span>轄區內（粗框）：台數</span><div class="bins">${HB.map(b=>`<span><span class="sw" style="background:var(${b[2]})"></span>${b[3]}</span>`).join('')}<span><span class="sw" style="background:var(--off)"></span>0</span></div>`;}
const mEl=document.getElementById('months');
function months(){mEl.innerHTML=MN.map((m,i)=>`<button data-i="${i}" class="${month===i?'on':''}">${m}</button>`).join('')+`<button data-i="${YTD}" class="${month===YTD?'on':''}">2026年</button><button data-i="${KI}" class="${month===KI?'on':''}">103ki（4–${NM}月）</button>`;}
mEl.onclick=e=>{const b=e.target.closest('button');if(!b)return;month=+b.dataset.i;months();recolor();render();};
months();recolor();render();setTimeout(resetView,50);

const DCOL={'歸仁一課':'#22c55e','歸仁二課':'#f59e0b','永康一課':'#a855f7','永康二課':'#ec4899','永康三課':'#3b82f6'};
let showKings=true;
const TAINAN=feats.filter(f=>f.properties.y==='台南市').map(f=>f.properties.c);
// 法人（巧克力合計）＝全部業代比；點據點／課＝只在該據點／課裡比；點個人＝不顯示
const kingOn=()=>showKings&&!isRep();
const kingPool=()=>(selKey.startsWith('all:')?REPS:members(selKey)).filter(r=>!r.hide);
function kingOf(c){const xs=kingPool().map(r=>({r,n:mv(r.d[c]||Z)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  if(!xs.length)return null;const top=xs.filter(x=>x.n===xs[0].n);return {n:xs[0].n,reps:top.map(x=>x.r),second:xs.find(x=>x.n<xs[0].n)};}
function drawKings(){
  const codes=TAINAN;
  const data=kingOn()?codes.map(c=>({c,k:kingOf(c)})).filter(x=>x.k&&x.k.reps.length===1):[];  // 只顯示「獨自最多」的人，並列不放貼圖
  const g=d3.select('#kings').selectAll('g.king').data(data,d=>d.c).join(en=>{const e=en.append('g').attr('class','king');e.append('circle');e.append('image');e.append('text').attr('class','kn');e.append('g').attr('class','badge');return e;});
  g.attr('transform',d=>{const [x,y]=path.centroid(byCode.get(d.c));return `translate(${x},${y}) scale(${1/k})`;})
   .on('click',(e,d)=>{selTown=d.c;recolor();render();})
   .on('pointermove',(e,d)=>{tip.innerHTML=townInfo(d.c);tip.hidden=false;const b=wrap.getBoundingClientRect();tip.style.left=(e.clientX-b.left+14)+'px';tip.style.top=(e.clientY-b.top+14)+'px';})
   .on('pointerleave',()=>tip.hidden=true);
  g.each(function(d){const el=d3.select(this),reps=d.k.reps,show=reps.slice(0,3),R=show.length>1?16:20,col=DCOL[reps[0].team]||'#64748b';
    el.select('circle').remove();el.select('image').remove();el.select('text.kn').remove();el.selectAll('g.av').remove();
    show.forEach((r,i)=>{const dx=(i-(show.length-1)/2)*R*1.25,key=HKEY[r.n],c2=DCOL[r.team]||'#64748b';
      const a=el.insert('g','g.badge').attr('class','av').attr('transform',`translate(${dx},0)`);
      if(key){a.append('image').attr('href',HEADS[key]).attr('x',-R-2).attr('y',-R-2).attr('width',2*R+4).attr('height',2*R+4);}
      else{a.append('circle').attr('r',R).attr('fill',c2).attr('stroke','#fff').attr('stroke-width',2.5);
        a.append('text').attr('class','kn').attr('y',4).attr('font-size',R>18?13:11).text(r.n.slice(-2));}});
    const nm=(reps.length>2?`${reps.length}人並列`:reps.map(x=>x.n.slice(-2)).join('/'))+' '+d.k.n+'台';
    const b=el.select('g.badge').attr('transform',`translate(0,${R+11})`);
    b.selectAll('*').remove();
    const w=nm.length*11+8;
    b.append('rect').attr('x',-w/2).attr('y',-9).attr('width',w).attr('height',17).attr('rx',8.5).attr('fill',reps.length>1?'#475569':col).attr('stroke','#fff').attr('stroke-width',1.5);
    b.append('text').attr('class','kc').attr('y',4).text(nm);
  });
}
function kingTable(){
  if(isRep())return `<div class="sec"><h4>🏆 台南市各區轄區王</h4><span class="dn">目前選的是個人，轄區王貼圖已隱藏。點「巧克力合計」或據點就會再出現。</span></div>`;
  const rows=TAINAN.map(c=>({c,f:byCode.get(c),k:kingOf(c)})).sort((a,b)=>(b.k?b.k.n:0)-(a.k?a.k.n:0));
  const cnt={};rows.forEach(x=>x.k&&x.k.reps.length===1&&(cnt[x.k.reps[0].n]=(cnt[x.k.reps[0].n]||0)+1));
  const rank=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`${n} ${v}區`).join('、');
  return `<div class="sec"><h4>🏆 台南市各區轄區王・${unitName()}（${mLabel()}）</h4><span class="dn">${selKey.startsWith('all:')?'全部業代':unitName()+'業代'}之中，每區「獨自」賣最多台的人才放貼圖，並列不放（已離職不列；■棕＝歸仁轄、■綠＝永康轄、■灰＝轄區外）。佔最多區：${rank||'—'}</span>
   <div class="tw"><table class="ktab"><tbody>${rows.map(x=>{const r=x.k&&x.k.reps[0];const key=r&&HKEY[r.n];
     return `<tr data-c="${x.c}" style="cursor:pointer"><td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${HOME['歸仁'].has(x.c)?'#a8694a':HOME['永康'].has(x.c)?'#3f9a68':'#9ca3af'};margin-right:4px"></span>${x.f.properties.n}</td><td>${x.k?(x.k.reps.length===1?`${HKEY[x.k.reps[0].n]?`<img src="${HEADS[HKEY[x.k.reps[0].n]]}">`:''} ${x.k.reps[0].n}`:`<span class="dn">並列：${x.k.reps.map(r=>r.n).join('、')}</span>`):'<span class="dn">無</span>'}</td><td>${x.k?x.k.n+' 台':''}</td></tr>`;}).join('')}</tbody></table></div></div>`;
}
const _render0=render;
render=function(){_render0();const sec=document.createElement('div');sec.innerHTML=kingTable();panel.insertBefore(sec.firstElementChild,panel.children[1]||null);
  panel.querySelectorAll('.ktab tr[data-c]').forEach(tr=>tr.onclick=()=>{selTown=tr.dataset.c;recolor();render();zoomTo([byCode.get(selTown)],8);});
  drawKings();_kbSync();
  if(isRep()&&window._lastRep!==selKey){const h=panel.querySelector('h2');if(h)setTimeout(()=>h.scrollIntoView({behavior:'smooth',block:'start'}),50);}
  window._lastRep=isRep()?selKey:null;};
zoom.on('zoom.kings',e=>{d3.select('#kings').selectAll('g.king').attr('transform',d=>{const [x,y]=path.centroid(byCode.get(d.c));return `translate(${x},${y}) scale(${1/e.transform.k})`;});});
document.getElementById('kbtn').onclick=e=>{showKings=!showKings;e.currentTarget.classList.toggle('on',showKings);drawKings();};
const _kbSync=()=>{const b=document.getElementById('kbtn');b.style.display=isRep()?'none':'';};
window.addEventListener('resize',drawKings);
render();
</script></body></html>
