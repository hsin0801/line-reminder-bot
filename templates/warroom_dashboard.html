<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巧克力汽車營業部｜業績進度儀表板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;
  --sub:#8b949e;--red:#cc0000;--blue:#0051ba;--em:#10b981;--yellow:#eab308;
  --orange:#f97316;--purple:#a855f7;--rose:#f43f5e;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC",sans-serif;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}

/* ── header ── */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:28px;flex-wrap:wrap}
.logo-badge{background:var(--red);color:#fff;font-family:monospace;font-weight:900;font-size:.7rem;letter-spacing:.15em;padding:3px 8px;border-radius:4px}
.h-title{font-size:1.6rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h-sub{font-size:.8rem;color:var(--sub);margin-top:6px}
.live-dot{width:8px;height:8px;background:var(--em);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.live-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:.75rem;font-weight:500;background:rgba(16,185,129,.08);color:var(--em);border:1px solid rgba(16,185,129,.2)}

/* ── mode toggle ── */
.mode-toggle{display:flex;border:1px solid rgba(255,255,255,.18);border-radius:8px;overflow:hidden;font-size:.8rem;font-weight:700}
.mode-toggle span{padding:6px 16px;background:rgba(255,255,255,.14);color:#fff;cursor:default}
.mode-toggle a{padding:6px 16px;background:transparent;color:rgba(255,255,255,.45);text-decoration:none;border-left:1px solid rgba(255,255,255,.18);transition:.15s}
.mode-toggle a:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.75)}

/* ── tabs ── */
.tabbar{display:flex;gap:4px;margin-bottom:28px;border-bottom:1px solid var(--border)}
.tabbtn{background:transparent;border:none;color:var(--sub);padding:10px 20px;border-bottom:2px solid transparent;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;margin-bottom:-1px}
.tabbtn.active{color:#fff;border-bottom-color:var(--red)}
.tabpanel{display:none}.tabpanel.active{display:block}

/* ── cards / grid ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 4px 6px rgba(0,0,0,.2)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:24px}
.kpi-label{font-size:.75rem;color:var(--sub);margin-bottom:6px}
.kpi-val{font-size:2.5rem;font-weight:900;font-family:monospace;color:#fff}
.kpi-val.em{color:var(--em)}
.kpi-sub{font-size:.7rem;color:var(--sub);margin-top:2px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:640px){.two-col,.three-col{grid-template-columns:1fr}}
.chart-wrap{position:relative;height:280px}
.section-title{font-size:.95rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.section-sub{font-size:.72rem;color:var(--sub);margin-bottom:14px}
.mb24{margin-bottom:24px}

/* ── tables ── */
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{padding:8px 12px;text-align:center;color:var(--sub);font-weight:600;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)}
th.tl{text-align:left}
td{padding:9px 12px;text-align:center;border-bottom:1px solid rgba(48,54,61,.5)}
td.tl{text-align:left;font-weight:600;color:#fff}
tr.dept-row td{background:rgba(139,148,158,.06);font-weight:700}
tr:hover td{background:rgba(255,255,255,.025)}
.mono{font-family:monospace;font-weight:700}
.ovx{overflow-x:auto}

/* ── badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:600;border:1px solid}
.g{background:rgba(16,185,129,.1);color:#34d399;border-color:rgba(16,185,129,.25)}
.y{background:rgba(234,179,8,.1);color:#fbbf24;border-color:rgba(234,179,8,.25)}
.o{background:rgba(249,115,22,.1);color:#fb923c;border-color:rgba(249,115,22,.25)}
.r{background:rgba(239,68,68,.1);color:#f87171;border-color:rgba(239,68,68,.25);animation:pulse 2s infinite}
.dash{color:rgba(139,148,158,.4)}

/* ── yoy bar ── */
.yoy-bar-wrap{position:relative;width:100%;height:10px;background:rgba(48,54,61,.8);border-radius:5px;overflow:visible}
.yoy-bar{height:10px;border-radius:5px;transition:.4s;position:absolute;top:0;left:0}
.yoy-ref-line{position:absolute;top:-3px;height:16px;width:2px;background:#fff;border-radius:1px;opacity:.9;z-index:2}

/* ── alert cards ── */
.alert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.alert-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.alert-fire{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.04)}

/* ── dept pill ── */
.dept-pill{font-size:.65rem;font-weight:600;padding:2px 6px;border-radius:4px}

/* ── loading / error ── */
.loading{text-align:center;color:var(--sub);padding:60px 0;font-size:.9rem}
.error{text-align:center;color:var(--rose);padding:40px 0;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">

<!-- header -->
<header>
  <div>
    <div class="h-title">
      巧克力汽車營業部｜業績進度儀表板
    </div>
    <div class="h-sub" id="updateTs">載入中…</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="mode-toggle">
      <span>⚡ 專業</span>
      <a href="/dashboard/">📋 簡易</a>
    </div>
    <span class="live-badge"><span class="live-dot"></span><span id="liveLabel">連線中</span></span>
  </div>
</header>

<!-- tabs -->
<div class="tabbar">
  <button class="tabbtn active" data-tab="faren">⚡ 法人</button>
  <button class="tabbtn" data-tab="yongkang">永康</button>
  <button class="tabbtn" data-tab="gueiren">歸仁</button>
</div>

<div id="tab-faren"  class="tabpanel active"><div class="loading">載入法人資料中…</div></div>
<div id="tab-yongkang" class="tabpanel"><div class="loading">載入永康資料中…</div></div>
<div id="tab-gueiren" class="tabpanel"><div class="loading">載入歸仁資料中…</div></div>

<!-- ══ 歸仁績效指標 Section（插入 tab-gueiren 之後） ══ -->
<div id="guiren-kpi-wrapper" style="display:none">
  <!-- style 和 HTML 主體由 guiren_section 提供 -->
</div>

</div><!-- /.wrap -->

<script>
const GUEIREN_AVATARS = {
  '林定緯':  '/img/LDW.png',
  '林適緯':  '/img/LSW.png',
  '陳建道':  '/img/CJD.png',
  '陳星佑':  '/img/CXY.png',
  '張姉瑀':  '/img/ZJY.png',
  '歐陽文智':'/img/OYWZ.png',
  '蔡明憬':  '/img/TMJ.png',
};
  
const BASE = window.location.origin;

const DEPT_COLOR = {
  '永康一課':'#a855f7',
  '永康二課':'#f472b6',
  '永康三課':'#3b82f6',
  '歸仁一課':'#10b981',
  '歸仁二課':'#eab308',
};

const DEPT_CLASS_COLOR = {
  '永康一課':'background:rgba(168,85,247,.15);color:#c084fc',
  '永康二課':'background:rgba(244,114,182,.15);color:#f9a8d4',
  '永康三課':'background:rgba(59,130,246,.15);color:#60a5fa',
  '歸仁一課':'background:rgba(16,185,129,.15);color:#34d399',
  '歸仁二課':'background:rgba(234,179,8,.15);color:#fbbf24',
};

const MODEL_COLORS = {'CR-V':'#cc0000','HRV':'#0051ba','FIT':'#444c56','CIVIC':'#e1a100','PRELUDE':'#7c3aed'};
const TRACK_MODELS = ['CR-V(PET)','CR-V(e:HEV)','HRV','FIT','CIVIC','PRELUDE'];
const TRACK_MODELS_DISPLAY = ['CR-V<br>(PET)','CR-V<br>(e:HEV)','HRV','FIT','CIVIC','PRELUDE'];
const ALERT_SKIP_MODELS = new Set(['CIVIC','PRELUDE']); 
let charts = {};

function avatarHtmlSmall(name, dept, size=32){
  const src = (typeof GUEIREN_AVATARS !== 'undefined') ? GUEIREN_AVATARS[name] : null;
  if(!src) return '';
  const border = dept ? `border:1.5px solid ${DEPT_COLOR[dept]||'#3b82f6'}` : '';
  return `<img src="${src}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;object-position:top center;vertical-align:middle;margin-right:5px;flex-shrink:0;${border}"
    onerror="this.style.display='none'">`;
}

function tbadge(d){
  if(d===null||d===undefined) return '<span class="dash">—</span>';
  const cls = d<10?'g':d<20?'y':d<30?'o':'r';
  return `<span class="badge ${cls}">${d}天</span>`;
}
function approxNote(approx){ return approx?' <span style="opacity:.45;font-size:.65rem">≈</span>':''; }

function deptPill(dept){
  const style = DEPT_CLASS_COLOR[dept]||'background:rgba(139,148,158,.15);color:#9ca3af';
  return `<span class="dept-pill" style="${style}">${dept}</span>`;
}

function yoyBar(last, now){
  const REF_PCT = 50;
  const diff = now - last;
  const isUp = diff >= 0;
  const ratio = last > 0 ? (now / last) : 1;
  const barWidth = Math.min(Math.max(ratio * REF_PCT, 0), 100);
  const barColor = isUp ? '#10b981' : '#f472b6'; 
  const diffSign = isUp ? '+' : '';
  const diffText = `${diffSign}${Math.round(diff)}台`;
  const diffColor = isUp ? '#34d399' : '#f472b6';

  return `
    <div style="min-width:180px;padding-bottom:4px">
      <div style="display:flex;justify-content:space-between;font-size:.7rem;margin-bottom:2px">
        <span style="color:var(--sub)">去年: ${last}台</span>
        <span style="font-weight:700;color:${diffColor}">${diffText}</span>
      </div>
      <div class="yoy-bar-wrap">
        <div class="yoy-bar" style="width:${barWidth}%;background:${barColor}"></div>
        <div class="yoy-ref-line" style="left:${REF_PCT}%" title="去年基準線 (100%)"></div>
      </div>
    </div>`;
}

function topModel(modelObj){
  const entries = Object.entries(modelObj).filter(([,v])=>v>0);
  if(!entries.length) return new Set();
  const max = Math.max(...entries.map(([,v])=>v));
  return new Set(entries.filter(([,v])=>v===max).map(([k])=>k));
}

function destroyChart(id){
  if(charts[id]){ charts[id].destroy(); delete charts[id]; }
}

// ══════════════════════ RENDER PANEL (據點) ══════════════════════
function renderBranch(tabId, g, teamStructure, deptTotals, deptYoyLast, monthDeptTotals){
  const el = document.getElementById('tab-'+tabId);
  const prefix = tabId;

  const item1 = g.item1_ytd_registration || {};
  const item4 = g.item4_ytd_by_model || {};
  const monthProgress = g.month_progress || {};
  const lastTrack = g.last_order_tracking || {};
  const yoyComp = g.yoy_comparison || null;
  const teamTotal = g.team_total_ytd_registration || 0;

  let kpiCards = `
    <div class="card kpi-col">
      <div class="kpi-label">🏆 年度累計領牌</div>
      <div class="kpi-val">${Math.round(teamTotal)}</div>
      <div class="kpi-sub">台</div>
    </div>`;
  if(deptTotals){
    const deptKeys = Object.keys(teamStructure);
    deptKeys.forEach((dept)=>{
      const val = deptTotals[dept]||0;
      const colorStyle = DEPT_COLOR[dept] ? `color:${DEPT_COLOR[dept]}` : '';
      kpiCards += `
        <div class="card kpi-col">
          <div class="kpi-label">${dept}</div>
          <div class="kpi-val" style="${colorStyle}">${Math.round(val)}</div>
          <div class="kpi-sub">台</div>
        </div>`;
    });
  }

  const lyTotal = yoyComp?.last_year_ytd ? Object.values(yoyComp.last_year_ytd).reduce((a,b)=>a+b,0) : null;
  if(lyTotal !== null){
    const diff = teamTotal - lyTotal;
    const pct = ((diff/lyTotal)*100).toFixed(1);
    kpiCards += `
      <div class="card kpi-col">
        <div class="kpi-label">📈 較去年同期</div>
        <div class="kpi-val em">${diff>=0?'+':''}${Math.round(diff)}</div>
        <div class="kpi-sub">台（${diff>=0?'+':''}${pct}%）</div>
      </div>`;
  }

  let yoyHtml = '';
  if(yoyComp && !yoyComp.error && yoyComp.last_year_ytd){
    const lyYtd = yoyComp.last_year_ytd;
    let yoyRows = '';
    Object.entries(teamStructure).forEach(([dept, members])=>{
      const deptLast = deptYoyLast?.[dept] || members.reduce((s,n)=>s+(lyYtd[n]||0),0);
      const deptNow  = deptTotals?.[dept] || members.reduce((s,n)=>s+(item1[n]||0),0);
      const dd = deptNow - deptLast;
      const dp = deptLast>0?((dd/deptLast)*100).toFixed(0):'—';
      yoyRows += `<tr class="dept-row">
        <td class="tl">${deptPill(dept)}</td>
        <td class="mono">${Math.round(deptLast)}</td>
        <td class="mono">${Math.round(deptNow)}</td>
        <td class="mono" style="color:${dd>=0?'#34d399':'#f87171'}">${dd>=0?'+':''}${Math.round(dd)} <span style="font-size:.65rem;opacity:.6">(${dd>=0?'+':''}${dp}%)</span></td>
        <td>${yoyBar(deptLast, deptNow)}</td>
      </tr>`;
      members.forEach(name=>{
        const last = lyYtd[name]||0;
        const now  = item1[name]||0;
        const d = now - last;
        const p = last>0?((d/last)*100).toFixed(0):'—';
        yoyRows += `<tr>
          <td class="tl"><span style="display:inline-flex;align-items:center">${avatarHtmlSmall(name,dept)}<span style="font-weight:600;color:#fff">${name}</span></span></td>
          <td class="mono" style="color:var(--sub)">${last}</td>
          <td class="mono" style="color:#fff">${now}</td>
          <td class="mono" style="color:${d>=0?'#34d399':'#f87171'}">${d>=0?'+':''}${d} <span style="font-size:.65rem;opacity:.6">(${d>=0?'+':''}${p}%)</span></td>
          <td>${yoyBar(last, now)}</td>
        </tr>`;
      });
    });
    yoyHtml = `
      <div class="card mb24 ovx">
        <div class="section-title">📈 與去年同期比較</div>
        <div class="section-sub">今年累計 vs 去年 ${yoyComp.last_year_date||'—'}（${yoyComp.last_year_file||''}）｜白色中線 = 去年 100% 基準</div>
        <table>
          <thead><tr>
            <th class="tl">業務員</th><th>去年</th><th>今年</th><th>增減</th><th style="text-align:left;min-width:180px">成長幅度</th>
          </tr></thead>
          <tbody>${yoyRows}</tbody>
        </table>
      </div>`;
  }

  let modelRows = '';
  const MODEL_ORDER = ['CR-V','HRV','FIT','CIVIC','PRELUDE'];
  const rawModelKeys = [...new Set(Object.values(item4).flatMap(m=>Object.keys(m)))].filter(k=>k!=='ZRV');
  const modelKeys = [
    ...MODEL_ORDER.filter(k=>rawModelKeys.includes(k)),
    ...rawModelKeys.filter(k=>!MODEL_ORDER.includes(k))
  ];

  const modelTopPerson = {};
  modelKeys.forEach(k=>{
    const max = Math.max(...Object.values(item4).map(m=>m[k]||0), 0);
    modelTopPerson[k] = max > 0 ? max : null;
  });
  Object.entries(teamStructure).forEach(([dept, members])=>{
    const deptSums = {};
    members.forEach(n=>modelKeys.forEach(k=>{ deptSums[k]=(deptSums[k]||0)+(item4[n]?.[k]||0); }));
    const deptTotal = Object.values(deptSums).reduce((a,b)=>a+b,0);
    let deptCells = modelKeys.map(k=>`<td class="mono">${deptSums[k]||0}</td>`).join('');
    modelRows += `<tr class="dept-row"><td class="tl">${deptPill(dept)}</td>${deptCells}<td class="mono" style="color:#fff;text-align:right">${deptTotal}</td></tr>`;
    members.forEach(name=>{
      const m = item4[name]||{};
      const sum = modelKeys.reduce((s,k)=>s+(m[k]||0),0);
      const cells = modelKeys.map(k=>{
        const v = m[k]||0;
        const isTop = modelTopPerson[k] !== null && v === modelTopPerson[k];
        return `<td class="mono" style="color:var(--sub)">${v}${isTop?' 👍':''}</td>`;
      }).join('');
      modelRows += `<tr><td class="tl"><span style="display:inline-flex;align-items:center">${avatarHtmlSmall(name,dept)}<span style="font-weight:600;color:#fff">${name}</span></span></td>${cells}<td class="mono" style="color:#fff;text-align:right;font-weight:700">${sum}</td></tr>`;
    });
  });
  
  const globalSums = {};
  modelKeys.forEach(k=>{ globalSums[k]=Object.values(item4).reduce((s,m)=>s+(m[k]||0),0); });
  const globalTotal = Object.values(globalSums).reduce((a,b)=>a+b,0);
  const globalCells = modelKeys.map(k=>`<td class="mono" style="color:#fff">${globalSums[k]||0}</td>`).join('');
  modelRows += `<tr style="border-top:2px solid var(--border)"><td class="tl" style="font-weight:800;color:#fff">全所合計</td>${globalCells}<td class="mono" style="color:#fff;text-align:right;font-weight:800">${globalTotal}</td></tr>`;

  let trackRows = '';
  Object.entries(teamStructure).forEach(([dept, members])=>{
    trackRows += `<tr class="dept-row"><td colspan="${TRACK_MODELS.length+1}" class="tl">${deptPill(dept)}</td></tr>`;
    members.forEach(name=>{
      const t = lastTrack[name]||{};
      const cells = TRACK_MODELS.map(m=>{
        const info = t[m];
        if(!info) return '<td><span class="dash">—</span></td>';
        return `<td>${tbadge(info.days_since)}${approxNote(info.approx)}</td>`;
      }).join('');
      trackRows += `<tr><td class="tl"><span style="display:inline-flex;align-items:center">${avatarHtmlSmall(name,dept)}<span style="font-weight:600;color:#fff">${name}</span></span></td>${cells}</tr>`;
    });
  });

  const alertItems = [];
  Object.entries(teamStructure).forEach(([dept, members])=>{
    members.forEach(name=>{
      const t = lastTrack[name]||{};
      TRACK_MODELS.forEach(model=>{
        if(ALERT_SKIP_MODELS.has(model)) return;
        const info = t[model];
        if(!info) return;
        const d = info.days_since;
        if(d >= 30) alertItems.push({ name, dept, model, days:d });
      });
    });
  });
  const ALERT_MDL_ORDER = ['CR-V(PET)','CR-V(e:HEV)','HRV','FIT'];
  alertItems.sort((a,b)=>{
    const ai=ALERT_MDL_ORDER.indexOf(a.model), bi=ALERT_MDL_ORDER.indexOf(b.model);
    if(ai!==bi) return (ai<0?99:ai)-(bi<0?99:bi);
    return b.days-a.days;
  });
  let alertCards='', alertCount=alertItems.length, lastAlertModel=null;
  alertItems.forEach(({name,dept,model,days})=>{
    const fire=days>=40;
    if(model!==lastAlertModel){
      const ml=model.replace('CR-V(PET)','CR-V (PET)').replace('CR-V(e:HEV)','CR-V (e:HEV)');
      alertCards+=`<div style="grid-column:1/-1;font-size:.72rem;font-weight:700;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;padding:8px 0 4px;border-top:${lastAlertModel?'1px solid var(--border)':'none'};margin-top:${lastAlertModel?'4px':'0'}">${ml}</div>`;
      lastAlertModel=model;
    }
    alertCards+=`<div class="alert-card${fire?' alert-fire':''}"><div><div style="font-weight:600;font-size:.85rem;color:#fff">${name} ${deptPill(dept)}</div></div><span class="badge r" style="font-size:.78rem">${fire?'🔥 ':''}${days}天</span></div>`;
  });
  if(!alertCount) alertCards='<div style="color:var(--sub);font-size:.85rem;padding:8px 0">目前無超過30天未開單的項目 ✅</div>';

  let monthRows = '';
  Object.entries(teamStructure).forEach(([dept, members])=>{
    const deptMonth = monthDeptTotals?.[dept]||{};
    monthRows += `<tr class="dept-row"><td class="tl">${deptPill(dept)}</td>
      <td class="mono" style="color:var(--yellow)">${deptMonth['訂單']||0}</td>
      <td class="mono" style="color:var(--em)">${deptMonth['領牌']||0}</td></tr>`;
    members.forEach(name=>{
      const mp = monthProgress[name]||{};
      monthRows += `<tr><td class="tl"><span style="display:inline-flex;align-items:center">${avatarHtmlSmall(name,dept)}<span style="font-weight:600;color:#fff">${name}</span></span></td>

      const t = allTrack[name]||{};
      const cells = TRACK_MODELS.map(m=>{ const info=t[m]; return info?`<td>${tbadge(info.days_since)}${approxNote(info.approx)}</td>`:'<td><span class="dash">—</span></td>'; }).join('');
      trackRows += `<tr><td class="tl" style="font-weight:600;color:#fff">${name}</td>${cells}</tr>`;
    });
  });

  const all4 = f.item4_all||{};
  const MODEL_ORDER_F = ['CR-V','HRV','FIT','CIVIC','PRELUDE'];

  const all4Keys = [...MODEL_ORDER_F.filter(k=>rawAll4Keys.includes(k)), ...rawAll4Keys.filter(k=>!MODEL_ORDER_F.includes(k))];
  
  const all4TopPerson = {};
  all4Keys.forEach(k=>{
    const max = Math.max(...Object.values(all4).map(m=>m[k]||0), 0);
    all4TopPerson[k] = max > 0 ? max : null;
  });
  let model4Rows = '';
  Object.entries(sortedStructure).forEach(([dept,members])=>{
    const ds = {}; members.forEach(n=>all4Keys.forEach(k=>{ ds[k]=(ds[k]||0)+(all4[n]?.[k]||0); }));

  const farenAlertItems = [];

    members.forEach(name=>{
      const t = allTrack[name]||{};
      TRACK_MODELS.forEach(model=>{
        if(ALERT_SKIP_MODELS.has(model)) return;
        const info=t[model]; if(!info) return;
        const d=info.days_since; if(d<30) return;
        farenAlertItems.push({name,dept,model,days:d});

  });
  const F_ALERT_ORDER = ['CR-V(PET)','CR-V(e:HEV)','HRV','FIT'];

    return b.days-a.days;

      <div class="alert-grid" style="margin-top:12px">${alertCards}</div>

    type:'bar',
    data:{ labels:deptChartLabels, datasets:[
      { label:'本月訂單', data:deptChartLabels.map(d=>(f.month_progress_dept_totals||{})[d]?.['訂單']||0), backgroundColor:'#eab308', borderRadius:4 },
      { label:'本月領牌', data:deptChartLabels.map(d=>(f.month_progress_dept_totals||{})[d]?.['領牌']||0), backgroundColor:'#10b981', borderRadius:4 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'top', labels:{ boxWidth:10, padding:12, color:'#c9d1d9', font:{size:11} } },
                tooltip:{ backgroundColor:'#1f242c', borderColor:'#30363d', borderWidth:1 } },
      scales:{ x:{ grid:{ color:'rgba(48,54,61,.5)' }, ticks:{ color:'#c9d1d9' } },
               y:{ grid:{ color:'rgba(48,54,61,.5)' }, ticks:{ stepSize:1 } } } }
  });
}

// ══════════════════════ FETCH & INIT ══════════════════════
async function fetchAll(retried=false){
  try{
    const [yk, gr, fr] = await Promise.all([
      fetch(BASE+'/yongkang-dashboard/data.json').then(r=>r.json()),
      fetch(BASE+'/gueiren-dashboard/data.json').then(r=>r.json()),
      fetch(BASE+'/faren-dashboard/data.json').then(r=>r.json()),
    ]);

    if(!retried && (gr.error || yk.error || fr.error)){
      document.getElementById('liveLabel').textContent = '資料重整中…';
      await Promise.all([
        fetch(BASE+'/yongkang-dashboard/refresh').catch(()=>{}),
        fetch(BASE+'/gueiren-dashboard/refresh').catch(()=>{}),
      ]);
      await fetch(BASE+'/faren-dashboard/refresh').catch(()=>{});
      return fetchAll(true);
    }

    document.getElementById('updateTs').textContent =
      `永康: ${yk.updated_at||'—'} ｜ 歸仁: ${gr.updated_at||'—'} ｜ 法人: ${fr.updated_at||'—'}`;
    document.getElementById('liveLabel').textContent = '資料已載入';

    renderBranch('yongkang', yk, yk.team_structure||{},
      yk.item1_dept_totals, yk.yoy_last_year_dept_totals, yk.month_progress_dept_totals);
    renderBranch('gueiren', gr, gr.team_structure||{},
      gr.item1_dept_totals, gr.yoy_last_year_dept_totals, gr.month_progress_dept_totals);
    renderFaren(fr, yk, gr);

    // 歸仁績效指標 Section 注入
    grInjectSection();

  } catch(e){
    console.error('warroom fetch error:', e);
    document.getElementById('liveLabel').textContent = '載入失敗：' + e.message;
    const errHtml = `<div class="error">⚠️ 資料載入失敗：${e.message}<br><small>請確認服務正常運行，或手動呼叫 /refresh 後重試。</small></div>`;
    ['faren','yongkang','gueiren'].forEach(id=>{
      document.getElementById('tab-'+id).innerHTML = errHtml;
    });
  }
}

document.querySelectorAll('.tabbtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    // 歸仁分頁才顯示績效指標 section
    const kpiWrapper = document.getElementById('guiren-kpi-wrapper');
    if(kpiWrapper) kpiWrapper.style.display = btn.dataset.tab==='gueiren' ? 'block' : 'none';
  });
});

fetchAll();

// ══ 歸仁績效指標 Section ══
function grInjectSection(){
  const wrapper = document.getElementById('guiren-kpi-wrapper');
  if(!wrapper || wrapper.dataset.injected) return;
  wrapper.dataset.injected = '1';

  // 掛載到 tab-gueiren 底部
  const tabEl = document.getElementById('tab-gueiren');
  if(tabEl) tabEl.appendChild(wrapper);
  wrapper.style.display = 'block';

  // 動態載入 CSS + HTML（避免重複注入）
  if(!document.getElementById('gr-style')){
    const style = document.createElement('style');
    style.id = 'gr-style';
    style.textContent = GR_STYLE;
    document.head.appendChild(style);
  }
  wrapper.innerHTML = GR_HTML;

  // 初始化資料
  grLoad();
  setInterval(grLoad, 300000);
}

/* ────────── 歸仁 KPI JS ────────── */
let GR_DATA=null, GR_ENTITY='歸仁據點', GR_PERIOD='ytd';

const GR_ROSTER=[
  {key:'歸仁據點',label:'歸仁據點',avatar:null,abbr:'歸'},
  {key:'歸仁一課',label:'一課',     avatar:null,abbr:'一'},
  {key:'林定緯',  label:'林定緯',   avatar:'/img/LDW.png'},
  {key:'林適緯',  label:'林適緯',   avatar:'/img/LSW.png'},
  {key:'陳建道',  label:'陳建道',   avatar:'/img/CJD.png'},
  {key:'歸仁二課',label:'二課',     avatar:null,abbr:'二'},
  {key:'陳星佑',  label:'陳星佑',   avatar:'/img/CXY.png'},
  {key:'張姉瑀',  label:'張姉瑀',   avatar:'/img/ZJY.png'},
  {key:'歐陽文智',label:'歐陽文智', avatar:'/img/OYWZ.png'},
  {key:'蔡明憬',  label:'蔡明憬',   avatar:'/img/TMJ.png'},
];

function grFmt(v,type){
  if(v==null) return '—';
  if(type==='pct') return (v*100).toFixed(1)+'%';
  if(type==='n')   return v.toLocaleString();
  return v;
}
function grBarCls(v,good,warn){
  if(v==null) return '';
  return v>=good?'good':v>=warn?'warn':'danger';
}
function grBarW(v,good){
  return v==null?0:Math.min(v/good,1.5)*100/1.5;
}

function grCards(entity, period){
  const d=entity[period]||{};
  const rc=(entity.renew||{}).curr||{};
  const ry=(entity.renew||{}).ytd||{};
  const renew_整體   =period==='curr'?rc['整體']   :ry['整體'];
  const renew_首年車體=period==='curr'?rc['首年車體']:ry['首年車體'];
  const renew_首年   =period==='curr'?rc['首年']   :ry['首年'];

  const cards=[
    {cls:'c-reg', label:'領牌台數',   main:grFmt(d.reg,'n'),
     sub:`訂單 ${grFmt(d.ord,'n')}`},
    {cls:'c-ins', label:'全險比（乙+丙÷母數）', main:grFmt(d['全險比'],'pct'),
     sub:d.full!=null?`${d.full}件 / 母數${d.base}`:'',
     bar:d['全險比'],good:0.93,warn:0.85},
    {cls:'c-yi',  label:'乙式比（乙÷母數）',    main:grFmt(d['乙式比'],'pct'),
     sub:d.yi!=null?`乙式${d.yi}件`:'',
     bar:d['乙式比'],good:0.70,warn:0.60},
    {cls:'c-loan',label:'分期比（元大÷母數）',   main:grFmt(d['分期比'],'pct'),
     sub:d.loan!=null?`元大${d.loan}件`:'',
     bar:d['分期比'],good:0.35,warn:0.25},
    {cls:'c-acc', label:'配件總額',
     main:d.acc_t?`${(d.acc_t/10000).toFixed(1)}萬`:'—',
     sub:d.acc_per?`${d.acc_per.toLocaleString()} 元/台`:''},
    {cls:'c-acc', label:'平均配件（元/台）',     main:grFmt(d.acc_per,'n'),
     sub:'目標 11,000',
     bar:d.acc_per?d.acc_per/11000:null,good:1.0,warn:0.85},
  ];

  if(period==='ytd'&&d.walk!=null){
    cards.push(
      {cls:'c-walk',label:'來店客數',main:grFmt(d.walk,'n'),
       sub:`成交${grFmt(d.walkC,'n')}（${d.walk>0?((d.walkC/d.walk)*100).toFixed(1)+'%':'—'}）`},
      {cls:'c-inv', label:'邀約客數',main:grFmt(d.inv,'n'),
       sub:`成交${grFmt(d.invC,'n')}（${d.inv>0?((d.invC/d.inv)*100).toFixed(1)+'%':'—'}）`},
    );
  }

  function renewCard(obj,cls,label){
    if(!obj) return '';
    const n=obj.num||0,dn=obj.den||0,rt=dn>0?n/dn:null;
    const prog=obj.progress;
    return {cls,label,main:grFmt(rt,'pct'),
      sub:`${n}件 / ${dn}件`,
      sub2:prog!=null?`進度 ${grFmt(parseFloat(prog),'pct')}`:null,
      bar:rt,good:cls==='c-renew'?0.82:0.60,warn:cls==='c-renew'?0.75:0.50};
  }
  const r1=renewCard(renew_整體,   'c-renew', period==='curr'?'整體續保（當月進度）':'整體續保（年度累計）');
  const r2=renewCard(renew_首年車體,'c-fyt',   period==='curr'?'首年車體（當月進度）':'首年車體（年度累計）');
  const r3=renewCard(renew_首年,   'c-fy',    period==='curr'?'首年續保（當月進度）':'首年續保（年度累計）');
  [r1,r2,r3].forEach(r=>{ if(r) cards.push(r); });

  return cards.map(c=>`
    <div class="gr-card ${c.cls}">
      <div class="gr-card-label">${c.label}</div>
      <div class="gr-card-main">${c.main}</div>
      <div class="gr-card-sub">${c.sub||''}</div>
      ${c.sub2?`<div class="gr-card-sub2">${c.sub2}</div>`:''}
      ${c.bar!=null?`<div class="gr-prog"><div class="gr-prog-bar ${grBarCls(c.bar,c.good,c.warn)}"
        style="width:${grBarW(c.bar,c.good)}%"></div></div>`:''}
    </div>`).join('');
}

function grRender(){
  if(!GR_DATA) return;
  const entity=GR_DATA.entities[GR_ENTITY];
  if(!entity){
    document.getElementById('gr-cards').innerHTML='<div class="gr-loading-txt">無資料</div>';
    return;
  }
  document.getElementById('gr-cards').innerHTML=grCards(entity,GR_PERIOD);
}

function grRenderRoster(){
  const html=GR_ROSTER.map(item=>{
    const sel=item.key===GR_ENTITY?'selected':'';
    const bold=!item.avatar?'font-weight:600;':'';
    const av=item.avatar
      ?`<img class="gr-avatar" src="${item.avatar}"
          onerror="this.style.display='none';this.nextSibling.style.display='flex'" alt="">
         <div class="gr-avatar-ph" style="display:none">${item.label[0]}</div>`
      :`<div class="gr-avatar-ph">${item.abbr||item.label[0]}</div>`;
    return `<div class="gr-roster-item ${sel}" style="${bold}"
              onclick="grSelect('${item.key}',this)">
              ${av}<span class="gr-roster-name">${item.label}</span></div>`;
  }).join('');
  document.getElementById('gr-roster').innerHTML=html;
}

window.grSelect=function(key,el){
  GR_ENTITY=key;
  document.querySelectorAll('.gr-roster-item').forEach(i=>i.classList.remove('selected'));
  if(el) el.classList.add('selected');
  grRender();
};
window.grPeriod=function(p,el){
  GR_PERIOD=p;
  document.querySelectorAll('.gr-period-btn').forEach(b=>b.classList.remove('active'));
  if(el) el.classList.add('active');
  grRender();
};

function grLoad(){
  fetch('/guiren-kpi/data.json')
    .then(r=>r.json())
    .then(data=>{
      GR_DATA=data;
      const m=(data.meta||{}).curr_month_name||'—';
      const btn=document.getElementById('gr-curr-btn');
      if(btn) btn.textContent=`當月（${m}月）`;
      grRenderRoster();
      grRender();
    })
    .catch(e=>{
      const el=document.getElementById('gr-cards');
      if(el) el.innerHTML=`<div class="gr-loading-txt">⚠️ 載入失敗：${e.message}</div>`;
    });
}
</script>
